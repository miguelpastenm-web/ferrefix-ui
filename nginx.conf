server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Archivos con hash en el nombre: caché larga. Si no existen, 404 (nunca caen en index.html).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El punto de entrada no se cachea: así un despliegue nuevo se ve de inmediato.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fallback de SPA: las rutas de React Router (/admin, /producto/5...) devuelven index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
